<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="594" rx="24" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#d4af37" letter-spacing="8">PRESTON'S CLUB</text>
  <text x="600" y="260" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="88" fill="#ffffff">TRIPLE PLAY</text>
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="88" fill="url(#gold)">VIDEO POKER</text>
  <text x="600" y="430" text-anchor="middle" font-family="Verdana, sans-serif" font-size="34" fill="#cbd5e1">Three hands. One draw. Triple the action.</text>
  <g font-size="72" text-anchor="middle">
    <text x="440" y="540" fill="#f8fafc">♠</text>
    <text x="547" y="540" fill="#ef4444">♥</text>
    <text x="653" y="540" fill="#ef4444">♦</text>
    <text x="760" y="540" fill="#f8fafc">♣</text>
  </g>
</svg>
